# components/ holds extension-point stories; haybale/ the library/package/marketplace
# story; guides/ cross-component patterns and worked examples; collaboration/ who does
# what across authors, users, contributors and maintainers; architecture/ system
# internals; reference/ shared truth (glossary, design guide).
