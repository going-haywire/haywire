name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A graph, a library, the clicks or commands that lead there.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Haywire version
      description: For example 0.4.2, or a commit.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and browser
    validations:
      required: false
