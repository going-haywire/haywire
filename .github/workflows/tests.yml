name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Run smoke tests
      run: |
        uv run pytest tests/test_smoke.py -v
    
    - name: Run unit tests
      run: |
        uv run pytest -m unit \
          --cov=packages \
          --cov=barn \
          --cov-report=xml \
          --cov-report=term-missing

    - name: Run integration tests
      run: |
        uv run pytest -m integration \
          --cov=packages \
          --cov=barn \
          --cov-append \
          --cov-report=xml \
          --cov-report=term-missing
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ui:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Install Playwright browser
      run: uv run playwright install --with-deps chromium

    - name: Run UI tests
      run: uv run pytest -m ui

# Linting lives in dedicated blocking workflows, not here:
#   ruff.yml — `ruff check .` + `ruff format --check .` (whole repo)
#   mypy.yml — packages/ + barn/ + tests/
# A `lint` job used to sit here running `ruff check src/ tests/` and
# `mypy src/` under continue-on-error. `src/` has not existed since the
# monorepo restructure (86e9cafa, 2026-02-20), so every step failed with
# E902 and was swallowed into a green check. Removed rather than repointed:
# the two workflows above already cover it, and they can actually fail.
