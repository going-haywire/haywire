name: Publish Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# A release is the merge of a release PR (ADR 0088). A push to master whose lockstep
# version differs from the latest v* tag runs gate -> build -> tag -> publish ->
# marketstall -> release notes; any other push to master ends green at the plan job.
# A v* tag pushed by hand (recovery) publishes without the tag job. scripts/release_plan.py
# decides which. Tags and pushes made with GITHUB_TOKEN start no further run, so the
# tag job's tag does not start a second publish.
#
# Permissions: id-token for PyPI OIDC (added in the publish job below).
# Default GITHUB_TOKEN permissions are restricted; jobs that need more
# raise them explicitly.

# One release at a time: a later push waits, so its plan sees the tag the earlier run made.
concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether this run releases
        id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/release_plan.py

  gate:
    name: Test gate
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install workspace
        run: uv sync --dev

      - name: Run fast test suite (gate)
        # Exclude `browser`-marked tests: they drive a real Playwright browser
        # that isn't provisioned on the release runner (no `playwright
        # install`). The marker is auto-applied to tests/ui/harness/ by
        # tests/conftest.py; `ui` does not select them. tests.yml runs them in
        # a job that does install a browser.
        run: uv run pytest -m "not integration and not browser and not perf" -q

  build:
    name: Build wheels
    runs-on: ubuntu-latest
    needs: [plan, gate]
    outputs:
      packages: ${{ steps.read-config.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install workspace
        run: uv sync --dev

      # The bump is a release-PR step (`/release` → scripts/bump_version.py),
      # so nothing downstream verifies that the version being released actually matches
      # the versions committed in the tree. A tag pushed by hand without the bump
      # would otherwise sail through: the publish job reads its version from
      # pyproject.toml, finds the PREVIOUS release already on PyPI, and skips
      # every package as "already published" — a green run that shipped nothing.
      # Fail here instead, before any wheel is built.
      - name: Verify the release version matches committed package versions
        run: uv run python scripts/check_release_versions.py --expect "$VERSION"
        env:
          VERSION: ${{ needs.plan.outputs.version }}

      # The haywire-core wheel force-includes packages/haywire-core/src/haywire/
      # _baked_docs/ as haywire/docs/. A committed .gitkeep keeps the directory
      # present (so editable installs above don't fail the force-include), but
      # the baked *contents* are gitignored — regenerate them here, from the
      # tagged source, before the wheel build. Uses the tag's version for the
      # source-file GitHub URLs baked into the docs.
      - name: Bake docs for the haywire-core wheel
        run: uv run python scripts/bake_docs.py --version "v${VERSION}"
        env:
          VERSION: ${{ needs.plan.outputs.version }}

      - name: Read pip_publish_order from [tool.haywire.release]
        id: read-config
        run: |
          packages=$(uv run python -c "
          import json, tomllib, pathlib
          d = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(json.dumps(d['tool']['haywire']['release']['pip_publish_order']))
          ")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Will build: $packages"

      - name: Build every wheel + sdist
        run: |
          rm -rf dist/
          uv run python <<'PY'
          import json, os, subprocess, sys
          packages = json.loads(os.environ["PACKAGES"])
          for name in packages:
              print(f'::group::Building {name}')
              r = subprocess.run(['uv', 'build', '--package', name], check=False)
              print('::endgroup::')
              if r.returncode != 0:
                  print(f'::error::Build failed for {name}', file=sys.stderr)
                  sys.exit(1)
          PY
        env:
          PACKAGES: ${{ steps.read-config.outputs.packages }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Tags the pushed commit once the gate and the build passed, so a failed gate leaves no
  # tag. The runner checks out the pushed commit, not a master that moved on.
  tag:
    name: Tag v${{ needs.plan.outputs.version }}
    runs-on: ubuntu-latest
    needs: [plan, build]
    if: needs.plan.outputs.tag != ''
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the pushed commit
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [plan, build, tag]
    if: >-
      ${{ !cancelled()
      && needs.plan.outputs.release == 'true'
      && needs.build.result == 'success'
      && needs.tag.result != 'failure' }}
    environment:
      name: pypi
      url: https://pypi.org/project/haywire-core/
    permissions:
      contents: read    # checkout needs this; an explicit block sets all others to none
      id-token: write   # required for Trusted Publisher (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install workspace
        run: uv sync --dev

      - name: Download wheels artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist/

      - name: Read pip_publish_order
        id: read-config
        run: |
          packages=$(uv run python -c "
          import json, tomllib, pathlib
          d = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(json.dumps(d['tool']['haywire']['release']['pip_publish_order']))
          ")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Publish each package (sequential, idempotent, fail-fast)
        run: |
          uv run python <<'PY'
          import json, os, pathlib, subprocess, sys, tomllib, urllib.request
          from scripts.bump_version import locate_packages, read_release_config

          packages = json.loads(os.environ["PACKAGES"])
          dist_root = pathlib.Path("dist")
          root = pathlib.Path("pyproject.toml")
          cfg = read_release_config(root)
          located = locate_packages(root, cfg)

          for name in packages:
              underscore = name.replace("-", "_")
              pkg_data = tomllib.loads(located[name].read_text())
              version = pkg_data["project"]["version"]

              url = f"https://pypi.org/pypi/{name}/{version}/json"
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      already_published = r.status == 200
              except Exception:
                  already_published = False

              if already_published:
                  print(f"::notice::{name}=={version} already on PyPI — skipping.")
                  continue

              files = list(dist_root.glob(f"{underscore}-{version}*"))
              if not files:
                  print(f"::error::No artifacts in dist/ for {name}=={version}", file=sys.stderr)
                  sys.exit(1)

              print(f"::group::Publishing {name}=={version}")
              r = subprocess.run(
                  ["uv", "publish", "--trusted-publishing", "always", *[str(f) for f in files]],
                  check=False,
              )
              print("::endgroup::")
              if r.returncode != 0:
                  print(f"::error::Publish failed for {name}=={version}", file=sys.stderr)
                  sys.exit(1)
          PY
        env:
          PACKAGES: ${{ steps.read-config.outputs.packages }}

  deploy-marketstall:
    name: Deploy marketstall to GitHub Pages
    runs-on: ubuntu-latest
    needs: [plan, publish]
    permissions:
      contents: write   # required to push the gh-pages branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install workspace
        run: uv sync --dev

      - name: Generate official feed (marketplace.toml + stalls/*.toml)
        run: |
          uv run python scripts/generate_marketstall.py \
              --out-dir gh-pages-content

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-content
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
          commit_message: "Deploy marketplace for v${{ needs.plan.outputs.version }}"

  release-notes:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [plan, deploy-marketstall]
    permissions:
      contents: write   # required to create the release
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
