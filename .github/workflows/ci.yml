# The gate for master: lint, types and both test tiers, side by side.
# Runs on every pull request and on master. CI runs every test (--maxfail=0 overrides
# pyproject's 5) so one run shows every failure. A draft PR runs on Linux only; once it is
# ready for review, the test tiers run on macOS too. A newer push cancels the run of
# an older one on the same branch. See .insights/project_pr_workflow.md.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

# Runners are pinned (ubuntu-24.04, not ubuntu-latest): a newer Ubuntu can arrive before
# Playwright supports it.
env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  # A package version changes only in a release PR ("chore: release vX.Y.Z").
  # Standard library only, so it needs no install and costs seconds.
  version-guard:
    name: version guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No version change outside a release PR
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_version_changes.py

  types:
    name: types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - name: mypy
        # The paths are [tool.mypy] files in pyproject.toml.
        run: uv run mypy

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS joins once a PR is ready for review.
        os: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) && fromJSON('["ubuntu-24.04", "macos-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Raise the file-watch limit
        # The suite starts more file watchers than Linux's default of 128 inotify instances allows.
        if: runner.os == 'Linux'
        run: sudo sysctl -w fs.inotify.max_user_instances=8192
      - name: pytest (not browser, not perf)
        run: >
          uv run pytest -m "not browser and not perf" -n 4 -q --maxfail=0
          --junitxml=reports/tests-${{ matrix.os }}.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: reports/

  browser:
    name: browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS joins once a PR is ready for review.
        os: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) && fromJSON('["ubuntu-24.04", "macos-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras --dev
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: pytest (browser)
        run: >
          uv run pytest -m browser -n 4 -q --maxfail=0
          --junitxml=reports/browser-${{ matrix.os }}.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.os }}
          path: reports/

  report:
    name: report
    needs: [tests, browser]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/**/*.xml
