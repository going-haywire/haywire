[project]
name = "haybale-core"
version = "0.1.3"
description = "Fundamental components for haywire graphs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["core", "types", "widgets", "skins", "adapters"]

dependencies = [
    "haywire-core>=0.1.3",
    "typing_extensions"]

# Entry point for Haywire library discovery
[[project.authors]]
name = "maybites"
[project.entry-points."haywire.libraries"]
core = "haybale_core:Library"

[project.urls]
Homepage = "https://github.com/going-haywire/haywire"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haybale_core"]

[tool.hatch.build.targets.sdist]
include = [
    "haybale_core/",
    "README.md",
]
