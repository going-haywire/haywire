[project]
name = "haybale-image"
version = "0.6.3"
description = "Image types, IO and viewers shared by vision and ML libraries"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "haywire-core>=0.6.3",
    "numpy",
    # AVIF encoding: 4.13.0.90 is the first opencv-contrib-python wheel that encodes
    # every layout. 4.10 and 4.11 are built without libavif; 4.12.0.88 has it but
    # rejects grayscale ("subsampling must be 0 (4:4:4) with identity matrix").
    "opencv-contrib-python>=4.13.0.90",
    "pillow>=12.0",
    "nicegui>=3.18.0",
    "fastapi",
    "typing_extensions",
]
keywords = ["image"]

[project.optional-dependencies]
# Torch residency for ImageValue. Optional so the monorepo lock stays torch-free;
# a torch-using library (haybale-spandrel) brings torch itself.
torch = ["torch"]

[project.entry-points."haywire.libraries"]
image = "haybale_image:Library"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haybale_image"]
