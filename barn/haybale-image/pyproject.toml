[project]
name = "haybale-image"
version = "0.3.3"
description = "Image types, IO and viewers shared by vision and ML libraries"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "haywire-core>=0.3.2",
    "numpy",
    "opencv-contrib-python>=5.0.0.93",
    "pillow>=12.0",
]
keywords = ["image"]

[project.optional-dependencies]
# Torch residency for ImageValue. Optional so the monorepo lock stays torch-free;
# a torch-using library (haybale-spandrel) brings torch itself.
torch = ["torch"]

[project.entry-points."haywire.libraries"]
image = "haybale_image:Library"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haybale_image"]
