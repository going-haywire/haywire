# Lint for the libraries in barn/: the root configuration, plus the rule that
# a library imports the framework through the Author API (ADR 0084).
extend = "../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"haywire.core".msg = "Import from haywire.api or haywire.api.workbench (ADR 0084); haywire.core is internal."
"haywire.ui".msg = "Import from haywire.api or haywire.api.workbench (ADR 0084); haywire.ui is internal."
"haywire.barn".msg = "Import from haywire.api or haywire.api.workbench (ADR 0084); haywire.barn is internal."

[lint.per-file-ignores]
# PT is a pytest-only style; libraries hold no tests. A package's __init__
# import order is load-bearing (the root config says why).
"**" = ["PT"]
"**/__init__.py" = ["I001"]
# Libraries that still import internals: not yet moved onto the Author API, or
# moved and holding an allowlist in tests/api/allowlist.py, which a test keeps
# shrinking. A library leaves this list when its allowlist is empty.
"haybale-graph-editor/**" = ["TID251"]
"haybale-haystack/**" = ["TID251"]
"haybale-marketplace/**" = ["TID251"]
"haybale-share/**" = ["TID251"]
"haybale-studio/**" = ["TID251"]
"haybale-testing/**" = ["TID251"]
