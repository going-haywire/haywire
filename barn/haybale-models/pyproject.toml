[project]
name = "haybale-models"
version = "0.3.4"
description = "Model references, local model store, downloads and graph needs-list"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "haywire-core>=0.3.4",
    "haybale-graph-editor>=0.3.4",
    "huggingface_hub>=2.4",
    "httpx>=0.28",
]
keywords = ["models"]

[project.entry-points."haywire.libraries"]
models = "haybale_models:Library"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haybale_models"]
