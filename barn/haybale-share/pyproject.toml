[project]
name = "haybale-share"
version = "0.1.0"
description = "Publish this project: dependencies, version, docs, commit, tag, push"
requires-python = ">=3.12"
license = {text = "MIT"}

# Deliberately NOT dependent on haybale-marketplace. The publish flow needs a
# LibraryRegistry to hot-swap bumped libraries, which comes from core's DI
# (get_library_system()); LibraryManager was only ever carrying it. The editor
# is status-only for the same reason — drilling into a library's details would
# mean opening marketplace's editors, and duplicating its browser besides.
dependencies = [
    "haywire-core>=0.1.0",
    "nicegui>=3.12.1",
]
keywords = ["publishing"]

[project.entry-points."haywire.libraries"]
share = "haybale_share:Library"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haybale_share"]
