[project]
name = "haybale-example"
version = "0.1.2"
description = "Example library for demonstrating multi-library support"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["example", "demo", "tutorial"]

dependencies = [
    "haywire-core>=0.1.2",
    "haybale-core>=0.1.2",
    "haybale-studio>=0.1.2",
    "nicegui>=3.12.1",
    "typing_extensions"]

# Entry point for Haywire library discovery
[[project.authors]]
name = "Example Author"
[project.entry-points."haywire.libraries"]
example = "haybale_example:Library"

[project.urls]
Homepage = "https://github.com/author/haywire_library"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haybale_example"]

[tool.hatch.build.targets.sdist]
include = [
    "haybale_example/",
    "README.md",
]
