[project]
name = "haybale-TEST_A"
version = "0.0.39"
description = "Test library A for demonstrating multi-library support"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["testing", "development"]

dependencies = ["haywire-core>=0.0.39"]

# Entry point for Haywire library discovery
[[project.authors]]
name = "Haywire Team"
[project.entry-points."haywire.libraries"]
test_a = "haybale_test_a:Library"

[project.urls]
Homepage = "https://github.com/going-haywire/haywire"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haybale_test_a"]

[tool.hatch.build.targets.sdist]
include = [
    "haybale_test_a/",
    "README.md",
]
