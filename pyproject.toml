[project]
name = "haywire-workspace"
version = "0.0.1"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.uv.workspace]
members = [
    "packages/*",
    "barn/*",
]

[tool.uv.sources]
haywire-core = { workspace = true }
haywire-studio = { workspace = true }
haybale-core = { workspace = true }
haybale-studio = { workspace = true }
haybale-example = { workspace = true }
haybale-testing = { workspace = true }
haybale-TEST_A = { workspace = true }
haybale-haystack = { workspace = true }
haybale-graph-editor = { workspace = true }
haybale-marketplace = { workspace = true }
haybale-share = { workspace = true }
haybale-image = { workspace = true }
haybale-audio = { workspace = true }
haybale-models = { workspace = true }

[dependency-groups]
dev = [
    # Floors at the version in use: the floors CI job lowers the dev group too (ADR 0095).
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4",
    "mypy>=2.1",
    # ty is pre-1.0 and ships new diagnostics frequently; pin exactly so the
    # non-blocking CI check (and local runs) stay reproducible. Bump deliberately.
    "ty==0.0.63",
    # Pin the minor series: ruff's formatter rules can change across minor
    # bumps, which would silently drift CI from local. Patch bumps are safe.
    "ruff>=0.12.8,<0.13",
    "pyinstaller>=6.14.1",
    "playwright>=1.60",
    "pytest-playwright>=0.8",
    "pytest-xdist>=3.8",
    "requests>=2.32",
    "haywire-core",
    "haywire-studio",
    "haybale-core",
    "haybale-studio",
    "haybale-example",
    "haybale-testing",
    "haybale-TEST_A",
    "haybale-haystack",
    "haybale-graph-editor",
    "haybale-marketplace",
    "haybale-share",
    "haybale-image",
    "haybale-audio",
    "haybale-models",
    "mkdocs-material>=9.7.6",
    "deptry>=0.25.1",
]

[tool.mypy]
python_version = "3.12"
# mypy skips the body of an unannotated function by default; this checks it too.
check_untyped_defs = true
# A stale ignore hides the next real error on its line (CS-T5).
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]
# What `uv run mypy` checks with no arguments; CI's types job runs exactly that.
files = [
    "packages/haywire-core/src/",
    "packages/haywire-studio/src/",
    "barn/haybale-core/haybale_core/",
    "barn/haybale-studio/haybale_studio/",
    "barn/haybale-marketplace/haybale_marketplace/",
    "barn/haybale-share/haybale_share/",
    "barn/haybale-graph-editor/haybale_graph_editor/",
    "barn/haybale-haystack/haybale_haystack/",
    "barn/haybale-testing/haybale_testing/",
    "barn/haybale-example/haybale_example/",
    "barn/haybale-TEST_A/haybale_test_a/",
    "barn/haybale-image/haybale_image/",
    "barn/haybale-audio/haybale_audio/",
    "barn/haybale-models/haybale_models/",
    "tests/",
]
mypy_path = [
    "packages/haywire-core/src",
    "packages/haywire-studio/src",
    "barn/haybale-core",
    "barn/haybale-studio",
    "barn/haybale-share",
    "barn/haybale-testing",
    "barn/haybale-example",
    "barn/haybale-TEST_A",
    "barn/haybale-haystack",
    "barn/haybale-graph-editor",
    "barn/haybale-marketplace",
    "barn/haybale-image",
    "barn/haybale-audio",
    "barn/haybale-models",
]

# haybale_visiongraph.* and cv2 are absent in CI: the library lives in its own
# repository, so the tests that import it resolve only in an environment that
# has it installed. They skip at runtime; mypy reads the imports either way.
[[tool.mypy.overrides]]
module = [
    "toml",
    "nicegui.*",
    "jedi",
    "jedi.*",
    "markdown2",
    "pygments.*",
    "visiongraph.*",
    "haybale_visiongraph.*",
    "haybale_spandrel.*",
    "cv2",
    "depthai",
    "psutil",
    "torch",
    "torch.*",
    "spandrel",
    "spandrel.*",
    "spandrel_extra_arches",
    "spandrel_extra_arches.*",
    "soundfile",
    "samplerate",
    "sounddevice",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 109
exclude = ["workbench/playground/", ".scratch/"]

[tool.ruff.lint]
# PT (flake8-pytest-style) and B (bugbear) catch problems neither mypy nor the
# default rules see: blind `pytest.raises(Exception)`, composite asserts that
# hide which half failed, mutable argument defaults, unchained re-raises.
# B applies repo-wide; PT is scoped to tests/ below.
# TID251 is banned-api (see below). TID252 bans relative imports, enforced in
# barn/ only (see .insights/feedback_no_relative_imports_in_barn.md).
# UP (pyupgrade) and I (isort) keep one annotation syntax and one import order,
# so agents stop copying whichever convention they read last (CS-T1, CS-I1).
# RUF100 and PGH004 police the escape hatches: a noqa that suppresses nothing
# and a bare noqa that suppresses everything both fail (CS-T5).
extend-select = ["E501", "PT", "B", "TID251", "TID252", "UP", "I", "RUF100", "PGH004"]
# UP038 is deprecated upstream: `isinstance(x, A | B)` is slower than a tuple.
# UP031 is about strings, not annotations, and its sites here are JS templates
# full of braces, where %-formatting reads better than escaped str.format.
ignore = ["UP031", "UP038"]

[tool.ruff.lint.isort]
# A file without it evaluates annotations at import time; I002 adds it (CS-T2).
required-imports = ["from __future__ import annotations"]
known-first-party = ["haywire", "haywire_studio", "haybale_*", "tests", "scripts", "benchmarks"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Dependency direction: haybale-* -> haywire-studio -> haywire-core, one way.
# The reverse edge is a package cycle (see
# .insights/project_app_library_dependency_direction.md). Nothing structural
# stopped core from importing a barn library, so this states it as a rule —
# a `try: import haybale_studio / except ImportError` reads as defensive and
# is still the arrow backwards, just silently.
#
# Enforced only where the arrow is illegal (the two package roots below);
# barn libraries import each other and the app freely.
"haybale_studio".msg = "haywire-core/-studio must not import a barn library — publish a signal a library answers (e.g. RevealComponentSource)."
"haybale_graph_editor".msg = "haywire-core/-studio must not import a barn library — publish a signal a library answers."
"haybale_haystack".msg = "haywire-core/-studio must not import a barn library — publish a signal a library answers."
"haybale_marketplace".msg = "haywire-core/-studio must not import a barn library — publish a signal a library answers."
"haybale_share".msg = "haywire-core/-studio must not import a barn library — publish a signal a library answers."
"haybale_core".msg = "haywire-core/-studio must not import a barn library — publish a signal a library answers."
"haybale_testing".msg = "haywire-core/-studio must not import a barn library — publish a signal a library answers."
# The Author API points one way: haywire.api -> core / ui / barn.builtin
# (ADR 0084). The framework never imports its own public module; the
# exceptions are the module itself and the node templates, which are copied
# into authors' libraries (per-file-ignores below).
"haywire.api".msg = "The framework does not import the Author API (ADR 0084) — import the internal module."

[tool.ruff.lint.per-file-ignores]
# The banned-api list above governs only the two packages the arrow
# constrains; everywhere else (barn libraries, tests, scripts, scratch
# prototypes) these imports are legal, so the rule is off by default and
# switched ON for those two roots.
#
# ONE negated pattern, not two: `"!a,!b"` silences a rule EVERYWHERE, since
# every file fails to match at least one half — which is how this rule first
# shipped enforcing nothing.
"!packages/**" = ["TID251"]
"packages/haywire-core/src/haywire/api/**" = ["TID251"]
"packages/haywire-core/src/haywire/barn/builtin/nodes/templates/**" = ["TID251"]
# Relative imports are banned in haybale libraries only; packages/ keeps them.
"!barn/**" = ["TID252"]
# A package's __init__ import order is load-bearing: the packages import each
# other while half-initialized, so sorting them breaks the cycles' order.
"**/__init__.py" = ["I001"]
# PT is a pytest-only style; production code has no test functions to lint.
"!tests/**" = ["PT"]

# B027 — empty non-abstract methods in an ABC. The four files below are the
# framework's public authoring surfaces, and every flagged method there is a
# documented OPTIONAL lifecycle hook ("default is a no-op; override to ..."):
# BaseEditor.on_focus/on_blur/cleanup, IWidget.cleanup, IType._validate_port_type
# /_configure_port, IAction.cleanup, DataField.remove_source. Marking them @abstractmethod would force
# every third-party editor, widget, type and undo-action author to write an
# empty stub. Scoped per-file on purpose: a new empty ABC method anywhere else
# still fails CI, which is the part of the rule worth keeping.
"packages/haywire-core/src/haywire/ui/editor/base.py" = ["B027"]
"packages/haywire-core/src/haywire/ui/widget/interface.py" = ["B027"]
"packages/haywire-core/src/haywire/core/types/interface.py" = ["B027"]
"packages/haywire-core/src/haywire/core/undo/interfaces.py" = ["B027"]
"packages/haywire-core/src/haywire/core/types/fields.py" = ["B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, full system)",
    "slow: Slow running tests",
    "ui: UI-related tests",
    "core: Core functionality tests",
    "perf: Performance micro/graph benchmarks (excluded from default run; `uv run pytest -m perf`)",
]
addopts = "-v --strict-markers --tb=short --maxfail=5 -m 'not perf'"
# A wedged test otherwise stalls the whole run indefinitely with no output —
# the suite looks alive while making no progress. The slowest legitimate test
# is ~17s, so this only ever fires on a genuine hang.
timeout = 120

[tool.haywire.release]
# Canonical machine-readable list of releasable packages.
# Consumed by: scripts/bump_version.py (this repo),
#              scripts/generate_marketstall.py,
#              .github/workflows/publish.yml.
# Order is significant for the publish workflow: dependencies first.

# Packages published to PyPI on every release tag, in dependency order.
pip_publish_order = [
    "haywire-core",
    "haywire-studio",
    "haybale-core",
    "haybale-studio",
    "haybale-marketplace",
    "haybale-share",
    "haybale-graph-editor",
    "haybale-haystack",
    "haybale-models",
    "haybale-image",
    "haybale-audio",
]

# Packages published via git subdirectory URL (binary deps or deferred from PyPI).
# Versioned in lockstep; installed as git+<source_url>#subdirectory=<pkg dir>.
git_publish_order = []

# Packages versioned in lockstep with the release but NOT published anywhere.
# The bump script updates these too so internal users stay coherent.
lockstep_unpublished = [
    "haybale-example",
    "haybale-testing",
    "haybale-TEST_A",
]

[tool.haywire.agents]
# The docs folder whose `serve: developer` pages the Farmhand bridge serves to agent
# sessions in this repository (docs/collaboration/workflow.md and the pages beside it).
developer-docs = "docs"

[tool.haywire.docs]
# Library ids whose docs `haywire docs --all` still generates but whose
# documentation gaps it does not report — test fixtures, not meant to be documented.
# Their naming lines still show.
coverage_exempt = [
    "haybale-testing",
    "haybale-TEST_A",
]

[tool.haywire.marketstall]
# Configuration for scripts/generate_marketstall.py.
# Consumed by the marketplace generator and the CI publish workflow.
#
# source_url/docs_branch are read but currently unconsumed by the generator:
# each entry's `origin` now comes from haybale.toml / the git remote via the
# shared marketstall builder, not from this repo-level URL. Left here (not
# deleted) since they still describe this repo's canonical remote.
source_url = "https://github.com/going-haywire/haywire"
docs_branch = "master"

# Base URL where the deployed feed lives. The generator composes the per-stall
# subscription URLs as "{feed_base_url}/stalls/{dist-name}.toml".
feed_base_url = "https://going-haywire.github.io/haywire"

# Explicit allowlist of packages that appear in the official marketplace feed,
# in the order they appear in the feed. Source (pypi vs git) is derived by
# lookup against pip_publish_order / git_publish_order above.
# Rules enforced at generation time:
#   - Every entry here must be in pip_publish_order or git_publish_order.
#   - No package may be in both pip_publish_order and git_publish_order.
marketplace = [
    "haybale-core",
    "haybale-studio",
    "haybale-marketplace",
    "haybale-share",
    "haybale-graph-editor",
    "haybale-haystack",
    "haybale-models",
    "haybale-image",
    "haybale-audio",
]
