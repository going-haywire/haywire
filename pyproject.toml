[project]
name = "haywire-workspace"
version = "0.0.1"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.uv.workspace]
members = [
    "packages/*",
    "barn/*",
]
# haybale-visiongraph lives in its own repo and is symlinked into barn/ for
# local editing. It is installed into the venv manually via
# `uv pip install -e .../barn/haybale-visiongraph`, NOT as a workspace member —
# excluding it here stops the `barn/*` glob from pulling the gitignored symlink
# into uv.lock (which CI can't resolve).
exclude = [
    "barn/haybale-visiongraph",
]

[tool.uv.sources]
haywire-core = { workspace = true }
haywire-studio = { workspace = true }
haybale-core = { workspace = true }
haybale-studio = { workspace = true }
haybale-example = { workspace = true }
haybale-testing = { workspace = true }
haybale-TEST_A = { workspace = true }
haybale-haystack = { workspace = true }
haybale-graph-editor = { workspace = true }
haybale-marketplace = { workspace = true }
haybale-share = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    # ty is pre-1.0 and ships new diagnostics frequently; pin exactly so the
    # non-blocking CI check (and local runs) stay reproducible. Bump deliberately.
    "ty==0.0.63",
    # Pin the minor series: ruff's formatter rules can change across minor
    # bumps, which would silently drift CI from local. Patch bumps are safe.
    "ruff>=0.12.8,<0.13",
    "pyinstaller>=6.14.1",
    "playwright",
    "pytest-playwright",
    "requests",
    "haywire-core",
    "haywire-studio",
    "haybale-core",
    "haybale-studio",
    "haybale-example",
    "haybale-testing",
    "haybale-TEST_A",
    "haybale-haystack",
    "haybale-graph-editor",
    "haybale-marketplace",
    "haybale-share",
    "mkdocs-material>=9.7.6",
    "deptry>=0.25.1",
]

[tool.mypy]
python_version = "3.12"
mypy_path = [
    "packages/haywire-core/src",
    "packages/haywire-studio/src",
    "barn/haybale-core",
    "barn/haybale-studio",
    "barn/haybale-share",
    "barn/haybale-testing",
    "barn/haybale-example",
    "barn/haybale-TEST_A",
    "barn/haybale-haystack",
    "barn/haybale-graph-editor",
    "barn/haybale-marketplace",
]

[[tool.mypy.overrides]]
module = ["toml", "nicegui.*", "jedi", "jedi.*", "markdown2", "pygments.*", "visiongraph.*", "depthai", "psutil"]
ignore_missing_imports = true

# Test functions rarely carry a return annotation, and mypy skips the BODY of
# any untyped function by default — so without this, most of tests/ was parsed
# but never actually analysed. Scoped to tests/ deliberately: production code
# has not been measured under this flag yet.
[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = true

[tool.ruff]
line-length = 109
exclude = ["playground/"]

[tool.ruff.lint]
# PT (flake8-pytest-style) and B (bugbear) catch problems neither mypy nor the
# default rules see: blind `pytest.raises(Exception)`, composite asserts that
# hide which half failed, mutable argument defaults, unchained re-raises.
# B applies repo-wide; PT is scoped to tests/ below.
extend-select = ["E501", "PT", "B"]

[tool.ruff.lint.per-file-ignores]
# PT is a pytest-only style; production code has no test functions to lint.
"!tests/**" = ["PT"]

# B027 — empty non-abstract methods in an ABC. The four files below are the
# framework's public authoring surfaces, and every flagged method there is a
# documented OPTIONAL lifecycle hook ("default is a no-op; override to ..."):
# BaseEditor.on_focus/on_blur/cleanup, IWidget.cleanup, IType._validate_port_type
# /_configure_port, IAction.cleanup. Marking them @abstractmethod would force
# every third-party editor, widget, type and undo-action author to write an
# empty stub. Scoped per-file on purpose: a new empty ABC method anywhere else
# still fails CI, which is the part of the rule worth keeping.
"packages/haywire-core/src/haywire/ui/editor/base.py" = ["B027"]
"packages/haywire-core/src/haywire/ui/widget/interface.py" = ["B027"]
"packages/haywire-core/src/haywire/core/types/interface.py" = ["B027"]
"packages/haywire-core/src/haywire/core/undo/interfaces.py" = ["B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, full system)",
    "slow: Slow running tests",
    "ui: UI-related tests",
    "core: Core functionality tests",
    "perf: Performance micro/graph benchmarks (excluded from default run; `uv run pytest -m perf`)",
]
addopts = "-v --strict-markers --tb=short --maxfail=5 -m 'not perf'"

[tool.haywire.release]
# Canonical machine-readable list of releasable packages.
# Consumed by: scripts/bump_version.py (this repo),
#              scripts/generate_marketstall.py,
#              .github/workflows/publish.yml.
# Order is significant for the publish workflow: dependencies first.

# Packages published to PyPI on every release tag, in dependency order.
pip_publish_order = [
    "haywire-core",
    "haywire-studio",
    "haybale-core",
    "haybale-studio",
    "haybale-marketplace",
    "haybale-share",
    "haybale-graph-editor",
    "haybale-haystack",
]

# Packages published via git subdirectory URL (binary deps or deferred from PyPI).
# Versioned in lockstep; installed as git+<source_url>#subdirectory=<pkg dir>.
git_publish_order = []

# Packages versioned in lockstep with the release but NOT published anywhere.
# The bump script updates these too so internal users stay coherent.
lockstep_unpublished = [
    "haybale-example",
    "haybale-testing",
    "haybale-TEST_A",
]

[tool.haywire.marketstall]
# Configuration for scripts/generate_marketstall.py.
# Consumed by the marketplace generator and the CI publish workflow.
#
# source_url/docs_branch are read but currently unconsumed by the generator:
# each entry's `origin` now comes from haybale.toml / the git remote via the
# shared marketstall builder, not from this repo-level URL. Left here (not
# deleted) since they still describe this repo's canonical remote.
source_url = "https://github.com/going-haywire/haywire"
docs_branch = "master"

# Base URL where the deployed feed lives. The generator composes the per-stall
# subscription URLs as "{feed_base_url}/stalls/{dist-name}.toml".
feed_base_url = "https://going-haywire.github.io/haywire"

# Explicit allowlist of packages that appear in the official marketplace feed,
# in the order they appear in the feed. Source (pypi vs git) is derived by
# lookup against pip_publish_order / git_publish_order above.
# Rules enforced at generation time:
#   - Every entry here must be in pip_publish_order or git_publish_order.
#   - No package may be in both pip_publish_order and git_publish_order.
marketplace = [
    "haybale-core",
    "haybale-studio",
    "haybale-marketplace",
    "haybale-share",
    "haybale-graph-editor",
    "haybale-haystack",
]
