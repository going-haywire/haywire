[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haywire-studio"
version = "0.6.3"
description = "Haywire Node Editor Application"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Haywire Team"}
]
keywords = ["haywire", "node-editor", "visual-programming", "application"]

dependencies = [
    "haywire-core>=0.6.3",
    "nicegui>=3.18.0",
    "toml>=0.10.2",
    "jedi>=0.19",
    "fastapi>=0.109.1",
    # 1.28: the StreamableHTTPSessionManager the studio host is built on. <2: mcp 2 drops
    # the low-level Server's handler decorators (list_tools) the host registers with.
    "mcp>=1.28,<2",
    "psutil>=5.9.6",
    "cryptography>=42",
    "anyio>=4.5",
    "httpx>=0.27.1",
]

[project.scripts]
haywire = "haywire_studio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/haywire_studio"]

[tool.hatch.build.targets.sdist]
include = [
    "src/haywire_studio/",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["toml", "haywire.*"]
ignore_missing_imports = true
