[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haywire-core"
version = "0.0.39"
description = "Haywire Node System Framework"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Haywire Team"}
]
keywords = ["haywire", "node-editor", "visual-programming", "framework"]

dependencies = [
    "nicegui>=3.12.1",
    "watchdog>=6.0.0",
    "injector>=0.22.0",
    "attrs==25.4.0",
    "cattrs==25.3.0",
    "toml>=0.10.2",
    # Style-preserving TOML round-trip. `toml` parses to plain dicts, so
    # re-serializing a file a human wrote destroys every comment in it. Code
    # that EDITS a user's pyproject.toml/marketplace.toml must go through
    # haywire.core.tomlio, never toml.dumps.
    "tomlkit>=0.13",
    "packaging",
    "typing_extensions",
    "markdown2>=2.5",
    "pygments>=2.18",
    "fastapi",
]

[project.urls]
Homepage = "https://github.com/going-haywire/haywire"
Author = "https://maybites.ch"

[tool.hatch.build.targets.wheel]
packages = ["src/haywire"]

[tool.hatch.build.targets.wheel.force-include]
"src/haywire/_baked_docs" = "haywire/docs"

[tool.hatch.build.targets.sdist]
include = [
    "src/haywire/",
    "src/haywire/_baked_docs/",
]
