# Key renames of haybale-testing in release 0.6 (rule N9: <X>ProbeNode, never a Test prefix).
#
# Apply to a project's graphs with:
#   uv run haywire rename --map <this file> --apply
# The rules behind the names: docs/reference/component-naming.md.

[[rename]]
old = "haybale-testing:node:TestBeginPlayNode"
new = "haybale-testing:node:BeginPlayProbeNode"
old_module = "haybale_testing.nodes.testbed.begin_play_node"
new_module = "haybale_testing.nodes.testbed.begin_play_probe"

